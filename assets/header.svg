<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 2s ease-in-out infinite}
      @keyframes pulse{50%{opacity:.35}}
    </style>
  </defs>
  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g class="fade d1">
    <circle cx="72" cy="70" r="5" fill="#34d399" class="pulse"/>
    <text x="86" y="75" class="mono" font-size="15" fill="#94a3b8">building with Go, TypeScript and AI agents</text>
  </g>

  <text x="64" y="150" class="sans fade d2" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">Nguyễn Văn Linh</text>
  <text x="66" y="196" class="sans fade d3" font-size="24" font-weight="500" fill="url(#accent)">Full-stack engineer · Go · TypeScript · AI agent systems</text>

  <g class="fade d4">
    <text x="66" y="244" class="mono" font-size="17" fill="#64748b">$</text>
    <text x="86" y="244" class="mono" font-size="17" fill="#cbd5e1">ship --agents 70+ --on web,desktop,mobile</text>
    <rect x="510" y="230" width="10" height="18" fill="#38bdf8" class="cursor"/>
  </g>

  <g class="fade d5 mono" font-size="14">
    <g transform="translate(64,290)">
      <rect width="212" height="52" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="18" y="33" fill="#f8fafc" font-size="20" font-weight="700">3</text>
      <text x="44" y="32" fill="#94a3b8">platforms shipped</text>
    </g>
    <g transform="translate(288,290)">
      <rect width="212" height="52" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="18" y="33" fill="#f8fafc" font-size="20" font-weight="700">70+</text>
      <text x="66" y="32" fill="#94a3b8">AI agents run</text>
    </g>
    <g transform="translate(512,290)">
      <rect width="212" height="52" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="18" y="33" fill="#f8fafc" font-size="20" font-weight="700">5+</text>
      <text x="52" y="32" fill="#94a3b8">years building</text>
    </g>
  </g>

  <!-- right: node graph motif -->
  <g transform="translate(900,190)" class="fade d3">
    <g stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" fill="none">
      <path d="M0 0L-110 -90M0 0L110 -80M0 0L130 70M0 0L-90 100M0 0L20 -130"/>
      <circle r="120" stroke-opacity="0.1" stroke-dasharray="4 8"/>
    </g>
    <circle r="34" fill="#0b1020" stroke="url(#accent)" stroke-width="2.5"/>
    <text y="6" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#f8fafc">hub</text>
    <g class="mono" font-size="12" fill="#cbd5e1" text-anchor="middle">
      <g transform="translate(-110,-90)"><circle r="22" fill="#111a33" stroke="#34d399" stroke-opacity=".7"/><text y="4">go</text></g>
      <g transform="translate(110,-80)"><circle r="22" fill="#111a33" stroke="#38bdf8" stroke-opacity=".7"/><text y="4">ts</text></g>
      <g transform="translate(130,70)"><circle r="24" fill="#111a33" stroke="#34d399" stroke-opacity=".7"/><text y="4">rust</text></g>
      <g transform="translate(-90,100)"><circle r="22" fill="#111a33" stroke="#38bdf8" stroke-opacity=".7"/><text y="4">pg</text></g>
      <g transform="translate(20,-130)"><circle r="22" fill="#111a33" stroke="#a78bfa" stroke-opacity=".8"/><text y="4">ai</text></g>
    </g>
  </g>
</svg>
